name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (staging)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/goatcorp/dalamud-distrib/raw/main/stg/latest.zip" -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath "$env:APPDATA\XIVLauncher\addon\Hooks\dev" -Force

      - name: Restore
        shell: pwsh
        run: dotnet restore src/DamageMeter.csproj

      - name: Build
        shell: pwsh
        run: dotnet build src/DamageMeter.csproj --configuration Release --no-restore

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $xml = [xml](Get-Content src/DamageMeter.csproj)
          $ver = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          # DalamudPackager (included in Dalamud.NET.Sdk) creates the zip automatically
          $zip = "src/bin/Release/DamageMeter/latest.zip"
          if (-not (Test-Path $zip)) { Write-Error "DalamudPackager zip not found at $zip"; exit 1 }
          Copy-Item $zip DamageMeter.zip
          Write-Host "Packaged: $((Get-Item DamageMeter.zip).Length) bytes"

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: DamageMeter v${{ steps.ver.outputs.VERSION }}
          files: DamageMeter.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $ts  = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $ver = "${{ steps.ver.outputs.VERSION }}"
          $json = @(Get-Content pluginmaster.json -Raw | ConvertFrom-Json)
          $json[0].AssemblyVersion = "$ver.0"
          $json[0].LastUpdated     = $ts
          $json | ConvertTo-Json -Depth 10 -AsArray | Set-Content pluginmaster.json

          git config user.name  "Sansflaire"
          git config user.email "sansflaire@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet || git commit -m "chore: update pluginmaster v$ver [skip ci]"
          git push
