name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/goatcorp/dalamud-distrib/raw/main/latest.zip" -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath C:\dalamud

      - name: Restore
        shell: pwsh
        env:
          DALAMUD_HOME: C:\dalamud
        run: dotnet restore src/DamageMeter.csproj

      - name: Build
        shell: pwsh
        env:
          DALAMUD_HOME: C:\dalamud
        run: dotnet build src/DamageMeter.csproj --configuration Release --no-restore

      - name: Get version
        id: ver
        shell: pwsh
        run: |
          $xml = [xml](Get-Content src/DamageMeter.csproj)
          $ver = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Package
        shell: pwsh
        run: |
          $out = "pack"
          New-Item -ItemType Directory $out | Out-Null
          $releaseDir = "src/bin/x64/Release"
          Copy-Item "$releaseDir/DamageMeter.dll" $out/
          # SkiaSharp managed wrapper
          Copy-Item "$releaseDir/SkiaSharp.dll" $out/ -ErrorAction SilentlyContinue
          # libSkiaSharp native — may be at output root or in runtimes subdirectory
          $native = Get-ChildItem "$releaseDir" -Recurse -Filter "libSkiaSharp.dll" | Select-Object -First 1
          if ($native) { Copy-Item $native.FullName $out/ } else { Write-Error "libSkiaSharp.dll not found in build output" }
          Copy-Item DamageMeter.json $out/
          Write-Host "Pack contents:"; Get-ChildItem $out | Format-Table Name, Length
          Compress-Archive -Path $out/* -DestinationPath DamageMeter.zip

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: DamageMeter v${{ steps.ver.outputs.VERSION }}
          files: DamageMeter.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $ts  = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $ver = "${{ steps.ver.outputs.VERSION }}"
          $raw = Get-Content pluginmaster.json -Raw | ConvertFrom-Json
          $entry = if ($raw -is [array]) { $raw[0] } else { $raw }
          $entry.AssemblyVersion = "$ver.0"
          $entry.LastUpdated     = $ts
          "[$($entry | ConvertTo-Json -Depth 5)]" | Set-Content pluginmaster.json

          git config user.name  "Sansflaire"
          git config user.email "sansflaire@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet || git commit -m "chore: update pluginmaster v$ver [skip ci]"
          git push
